<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ពិធីប្រកាសបើកភោជនីយដ្ឋានសារជាថ្មី | Restaurant Grand Reopening Celebration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="footer.png">
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="container">
        <h1>សូមស្វាគមន៍មកកាន់</h1>
        <p class="welcome-en">Welcome to</p>

        <h2 class="restaurant-name">ភោជនីយដ្ឋានយើងខ្ញុំ</h2>
        <h3 class="restaurant-name-en">Our Restaurant</h3>

        <p class="celebration-text">ពិធីប្រកាសបើកបម្រើអតិថិជនសារជាថ្មី និងបាញ់កាំជ្រួចអបអរសាទរ</p>
        <p class="celebration-text-en">Grand Reopening Announcement &amp; Celebratory Fireworks Display</p>

        <button id="celebrateBtn">
            ចុចដើម្បីបាញ់កាំជ្រួច 🎉<br>
            <span class="btn-en">Click to Launch Fireworks</span>
        </button>
    </div>

    <script src="script.js"></script>
    <script src="music.js"></script>
</body>
</html>
